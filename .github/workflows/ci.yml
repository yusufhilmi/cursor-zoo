name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    env:
      # Runners have the Xcode licence accepted, so the full toolchain is fine here.
      # build.sh only falls back to the Command Line Tools when this is unset.
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./build.sh

      - name: Render self-tests
        # Both exit non-zero if the drawing path produces a blank image, so this is
        # a real check and not just a smoke test - without hiding anyone's cursor.
        run: |
          mkdir -p renders
          .build/release/CursorZoo --selftest renders/sheet.png

      - name: Upload renders
        # Reviewers can eyeball art changes straight from the PR's artifacts.
        uses: actions/upload-artifact@v4
        with:
          name: renders
          path: renders/
